function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=cv.clientWidth;VH=cv.clientHeight;
  cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);

const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);

const TAU=Math.PI*2;
function angDiff(a,b){let d=Math.abs(a-b)%TAU;if(d>Math.PI)d=TAU-d;return d;}

let AC=null,muted=false;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f1,f2,dur,type,vol){
  if(muted)return;const a=actx();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
  o.type=type||'square';o.frequency.setValueAtTime(f1,t);
  if(f2&&f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.07,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03);
}

/* ============================ 工具 ============================ */
function collide(x,y,r){
  if(x<WALL+r||x>WW-WALL-r||y<WALL+r||y>WH-WALL-r)return true;
  for(const f of solids){if(x+r>f.x&&x-r<f.x+f.w&&y+r>f.y&&y-r<f.y+f.h)return true;}
  return false;
}
function blocked(x1,y1,x2,y2){
  const n=Math.ceil(Math.hypot(x2-x1,y2-y1)/13);
  for(let i=1;i<n;i++){
    const t=i/n,px=x1+(x2-x1)*t,py=y1+(y2-y1)*t;
    for(const f of solids){if(f.sight&&px>f.x-3&&px<f.x+f.w+3&&py>f.y-3&&py<f.y+f.h+3)return true;}
  }
  return false;
}
function inCone(o,target,half,radius,center){
  const dx=target.x-o.x,dy=target.y-o.y,d=Math.hypot(dx,dy);
  if(d>radius)return false;
  const a=Math.atan2(dy,dx);
  if(angDiff(a,center)>half)return false;
  return !blocked(o.x,o.y,target.x,target.y);
}
function moveActor(a,dx,dy,sp,dt,r){
  let moved=false;
  const nx=a.x+dx*sp*dt,ny=a.y+dy*sp*dt;
  if(!collide(nx,a.y,r)){a.x=nx;moved=true;}
  if(!collide(a.x,ny,r)){a.y=ny;moved=true;}
  if(!moved&&(Math.abs(dx)+Math.abs(dy))>0){
    const s=Math.sign(Math.abs(dx)>Math.abs(dy)?dy:dx)||1;
    if(Math.abs(dx)>Math.abs(dy)){if(!collide(a.x,a.y+s*sp*dt,r))a.y+=s*sp*dt;}
    else{if(!collide(a.x+s*sp*dt,a.y,r))a.x+=s*sp*dt;}
  }
  return moved;
}
function foodNear(){
  let best=null,bd=96;
  for(const f of foods){if(f.amount<=0)continue;const d=Math.hypot(f.x-cat.x,f.y-cat.y);if(d<bd){bd=d;best=f;}}
  return best;
}
function particle(x,y,color,n,sp){
  for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-sp,sp),vy:rand(-sp,sp)-20,life:rand(.35,.8),max:.8,c:color,s:rand(2,5)});
}
function floater(x,y,text,color){floaters.push({x,y,text,c:color,life:1.15});}
function say(text,warn,dur){const el=document.getElementById('subtitle');el.textContent=text;el.className=(warn?'warn ':'')+'show';subT=dur;}
function bigText(text,colors){
  const el=document.getElementById('bigtext');el.textContent=text;
  el.style.color=(colors&&colors[0])||'#fff';el.className='';
  if(text){void el.offsetWidth;el.className='pop';}
}
function unlock(id){
  if(sessionAchv.indexOf(id)>=0)return;
  sessionAchv.push(id);
  const a=ACHV.find(x=>x.id===id);if(!a)return;
  const isNew=saved.achv.indexOf(id)<0;
  if(isNew){saved.achv.push(id);save();sessionNewAchv.push(a.name);}
  const box=document.getElementById('achv');
  const d=document.createElement('div');d.className='achvcard';
  d.innerHTML='<div class="t">'+(isNew?'ACHIEVEMENT UNLOCKED':'成就达成')+'</div><div class="n">'+a.name+'</div><div class="d">'+a.desc+'</div>';

/* ============================ 更新 ============================ */
function update(dt){
  clock+=dt;
  timeLeft-=dt;
  if(timeLeft<=0){endGame(false,'TIME UP','时间到了，还没偷够');return;}
  if(subT<900)subT-=dt;
  if(subT<=0)$('subtitle').className='';
  bangCD=Math.max(0,bangCD-dt);
  stepT-=dt;
  if(cat.invuln>0)cat.invuln-=dt;
  if(cat.stun>0)cat.stun-=dt;
  shake=Math.max(0,shake-dt*22);flashA=Math.max(0,flashA-dt*2.2);
  $('flash').style.opacity=flashA.toFixed(3);
  noise=Math.max(0,noise-dt*(cat.eating?16:26));
  stats.noisePeak=Math.max(stats.noisePeak,noise);
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0;}
  if(stats.spottedFresh>0)stats.spottedFresh-=dt;

  /* --- 小猫移动 --- */
  let ix=0,iy=0;
  if(keys['a']||keys['arrowleft'])ix-=1;
  if(keys['d']||keys['arrowright'])ix+=1;
  if(keys['w']||keys['arrowup'])iy-=1;
  if(keys['s']||keys['arrowdown'])iy+=1;
  const sneak=!!keys['shift'];
  const len=Math.hypot(ix,iy)||1;
  ix/=len;iy/=len;
  const speed=(sneak?92:186)*(cat.stun>0?.45:1);
  if(cat.stun<=0){
    cat.vx=lerp(cat.vx,ix*speed,1-Math.pow(.001,dt));
    cat.vy=lerp(cat.vy,iy*speed,1-Math.pow(.001,dt));
  }
  const moving=Math.hypot(cat.vx,cat.vy);
  if(moving>18){
    cat.facing=Math.atan2(cat.vy,cat.vx);
    cat.walk+=dt*(sneak?7:13);
    noise+=dt*(sneak?3:13);
    if(!sneak&&stepT<=0){stepT=.27;SFX.step();}
    // 撞到易响物件
    if(bangCD<=0&&moving>100){
      for(const f of solids){if(f.noisy&&Math.abs(cat.x-(f.x+f.w/2))<f.w/2+30&&Math.abs(cat.y-(f.y+f.h/2))<f.h/2+30){
        bangCD=1.4;noise+=38;shake=7;floater(cat.x,cat.y-34,'哐当!!','#ff5b52');SFX.bonk();
        particle(cat.x,cat.y,'#ffd23f',12,130);say('[ 哎哟 ] 碰倒东西了，厨师肯定听见了',true,2.2);break;}}
    }
  } else {
    cat.vx=lerp(cat.vx,0,1-Math.pow(.0001,dt));
    cat.vy=lerp(cat.vy,0,1-Math.pow(.0001,dt));
  }
  moveActor(cat,cat.vx/Math.max(1,speed),cat.vy/Math.max(1,speed),Math.hypot(cat.vx,cat.vy),dt,cat.r);
  cat.tail+=dt*(3+moving*.02);

  /* --- 偷吃 --- */
  const target=foodNear();
  const wantEat=!!keys['e']&&cat.stun<=0;
  cat.eating=false;
  if(wantEat&&target){
    cat.eating=true;
    cat.facing=Math.atan2(target.y-cat.y,target.x-cat.x);
    cat.eatT-=dt;
    if(cat.eatT<=0){
      cat.eatT=.72;
      target.amount--;
      const mult=1+Math.min(2,Math.floor(combo/3)*.5);
      const gain=Math.round(target.score*mult);
      score+=gain;combo++;comboT=4.6;
      stats.bites++;stats.eaten[target.id]=true;
      stats.maxCombo=Math.max(stats.maxCombo,combo);
      noise+=18+(target.score>40?7:0);
      floater(target.x+rand(-26,26),target.y-48,'+'+gain,target.color);
      particle(target.x,target.y,target.color,9,100);
      SFX.bite();setTimeout(()=>SFX.score(),55);
      if(stats.bites===1)unlock('first');
      if(combo>=5)unlock('combo5');
      if(Object.keys(stats.eaten).length>=6)unlock('menu');
      if(stats.bites>=20)unlock('gulp');
      if(dist(cat,chef)<105&&chef.state==='COOK')unlock('close');
      if(target.amount<=0){target.respawn=18;floater(target.x,target.y-52,'吃光了','#fff');}
      if(score>=D.target){endGame(true,null,null);return;}
    }
  } else cat.eatT=0;
  for(const f of foods){
    f.glow+=dt*2;
    if(f.amount<=0){f.respawn-=dt;if(f.respawn<=0){f.amount=3;particle(f.x,f.y,f.color,10,70);SFX.refill();}}
  }

  /* --- 通缉等级 --- */
  wanted=clamp(Math.floor((noise>62?1:0)+(stats.spottedFresh>0?1:0)+(stats.hits+stats.busts>0?1:0)),0,3);

  /* --- 厨师 AI --- */
  updateChef(dt);

  /* --- 服务员 AI --- */
  updateWaiter(dt);

  /* --- 粒子 --- */
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=180*dt;}
  for(let i=floaters.length-1;i>=0;i--){const f=floaters[i];f.life-=dt;f.y-=34*dt;if(f.life<=0)floaters.splice(i,1);}

  /* --- 镜头 --- */
  const tx=clamp(cat.x+cat.vx*.22-VW/2,Math.min(0,(WW-VW)/2),Math.max(0,WW-VW));
  const ty=clamp(cat.y+cat.vy*.22-VH/2,Math.min(0,(WH-VH)/2),Math.max(0,WH-VH));
  cam.x=lerp(cam.x,tx,1-Math.pow(.0008,dt));cam.y=lerp(cam.y,ty,1-Math.pow(.0008,dt));
  syncHUD();
}

function updateChef(dt){
  const c=chef;c.pot+=dt;
  const aggro=1+wanted*.35;
  if(c.state==='COOK'){
    c.facing=-Math.PI/2;
    c.t-=dt;
    c.susp+=dt*(.055+.10*aggro)+dt*Math.max(0,noise-28)*.0035;
    if(c.t<=0||c.susp>=1){c.state='TURN';c.t=.55;c.susp=0;SFX.suspect();say('[ 嘘 ] 厨师好像听见了什么…',true,1.5);}
  } else if(c.state==='TURN'){
    c.t-=dt;c.facing=lerp(-Math.PI/2,Math.PI/2,1-clamp(c.t/.55,0,1));
    if(c.t<=0){c.state='LOOK';c.t=rand(1.9,2.7)+wanted*.25;c.lookC=Math.PI/2;}
  } else if(c.state==='LOOK'){
    c.t-=dt;c.facing=c.lookC;
    c.sweep=Math.sin((2.5-c.t)*2.3)*.42;
    const center=Math.PI/2+c.sweep;
    if(cat.eating&&cat.invuln<=0&&inCone(c,cat,52*Math.PI/180,780,center)){
      spotByChef();return;
    }
    if(c.t<=0){c.state='BACK';c.t=.45;}
  } else if(c.state==='BACK'){
    c.t-=dt;c.facing=lerp(Math.PI/2,-Math.PI/2,1-clamp(c.t/.45,0,1));
    if(c.t<=0){c.state='COOK';c.t=rand(2.4,4.6)/aggro;c.susp=0;}
  } else if(c.state==='CHASE'){
    c.chaseT+=dt;c.lostT+=dt;
    const dx=cat.x-c.x,dy=cat.y-c.y,d=Math.hypot(dx,dy)||1;
    c.facing=Math.atan2(dy,dx);
    moveActor(c,dx/d,dy/d,214+wanted*12,dt,c.r);
    if(d<40&&cat.invuln<=0){bonk();return;}
    const sees=!blocked(c.x,c.y,cat.x,cat.y)&&d<560;
    if(sees)c.lostT=0;
    if(c.lostT>3.4||c.chaseT>9){
      if(c.chaseT>=5)unlock('escape');
      c.state='RETURN';say('[ 呼 ] 厨师放弃了，回去炒菜了',false,2);
    }
  } else if(c.state==='RETURN'){
    const dx=c.home.x-c.x,dy=c.home.y-c.y,d=Math.hypot(dx,dy)||1;
    c.facing=Math.atan2(dy,dx);
    if(d>8)moveActor(c,dx/d,dy/d,180,dt,c.r);
    else{c.state='COOK';c.t=rand(2.2,3.6)/aggro;c.susp=.25;}
  }
}
function spotByChef(){
  stats.spotted++;stats.spottedFresh=14;noise=Math.max(noise,72);
  chef.state='CHASE';chef.chaseT=0;chef.lostT=0;
  combo=0;comboT=0;shake=9;flashA=.42;
  bigText('SPOTTED!',['#ffcf3f']);
  say('[ 被发现了!! ] 快跑！厨师抄起锅铲了',true,2.6);
  floater(cat.x,cat.y-40,'!!','#ff3b30');SFX.alert();
}
function bonk(){
  stats.hits++;lives--;score=Math.max(0,score-25);combo=0;comboT=0;
  cat.invuln=1.8;cat.stun=.5;noise=40;shake=16;flashA=.75;
  const dx=cat.x-chef.x,dy=cat.y-chef.y,d=Math.hypot(dx,dy)||1;
  cat.x+=dx/d*75;cat.y+=dy/d*75;
  if(collide(cat.x,cat.y,cat.r)){cat.x-=dx/d*75;cat.y-=dy/d*75;}
  cat.vx=dx/d*260;cat.vy=dy/d*260;
  particle(cat.x,cat.y,'#ff5b52',22,210);
  floater(cat.x,cat.y-42,'-25 & 挨了一下','#ff5b52');
  bigText('BONK!',['#ff5b52']);say('[ 疼 ] 挨了一锅铲，连击断了',true,2.4);
  SFX.bonk();
  chef.state='RETURN';
  if(lives<=0){endGame(false,'WASTED','被厨师打趴了');}
}
function updateWaiter(dt){
  const w=waiter;
  if(!w.active){
    if(doorWarn>=0){doorWarn-=dt;if(doorWarn<=0){spawnWaiter();}return;}
    waiterTimer-=dt;
    if(waiterTimer<=0){doorWarn=2.0;SFX.door();say('[ 叮咚 ] 服务员要进来传菜了！',true,2);}
    return;
  }
  w.t+=dt;
  let tx,ty,sp=165;
  if(w.state==='ENTER'){tx=1300;ty=600;if(Math.hypot(tx-w.x,ty-w.y)<20){w.state='PICK';w.t=0;}}
  else if(w.state==='PICK'){tx=w.x;ty=w.y;if(w.t>1.8){w.state='SCAN';w.t=0;SFX.door();say('[ 小心 ] 服务员在扫视餐厅…',true,2);}}
  else if(w.state==='SCAN'){
    tx=w.x;ty=w.y;
    w.facing=2.15+Math.sin(w.t*1.5)*.55;
    if(cat.eating&&cat.invuln<=0&&inCone(w,cat,58*Math.PI/180,430,w.facing)){bust();return;}
    if(w.t>2.5){w.state='LEAVE';w.t=0;}
  }
  else if(w.state==='LEAVE'){tx=1500;ty=1030;if(Math.hypot(tx-w.x,ty-w.y)<25){w.active=false;w.state='OFF';waiterTimer=rand(11,17)-wanted*1.8;doorWarn=-1;return;}}
  const dx=tx-w.x,dy=ty-w.y,d=Math.hypot(dx,dy)||1;
  if(d>6){
    if(w.state!=='PICK'&&w.state!=='SCAN')w.facing=Math.atan2(dy,dx);
    moveActor(w,dx/d,dy/d,sp,dt,w.r);
  }
  // 走动中也可能撞见

function rr(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}

function conePoints(o,half,radius,center){
  const pts=[],N=34,STEP=18;
  for(let i=0;i<=N;i++){
    const a=center-half+2*half*i/N;
    let r=radius;
    for(let d=STEP;d<radius;d+=STEP){
      const px=o.x+Math.cos(a)*d,py=o.y+Math.sin(a)*d;
      let hit=false;
      for(const f of solids){if(f.sight&&px>f.x&&px<f.x+f.w&&py>f.y&&py<f.y+f.h){hit=true;break;}}
      if(hit){r=d;break;}
    }
    pts.push([o.x+Math.cos(a)*r,o.y+Math.sin(a)*r]);
  }
  return pts;
}
function drawVision(){
  function cone(o,half,radius,center,fill){
    const pts=conePoints(o,half,radius,center);
    ctx.save();ctx.globalAlpha=fill;ctx.fillStyle='#ff5a3c';
    ctx.beginPath();ctx.moveTo(o.x,o.y);
    for(const p of pts)ctx.lineTo(p[0],p[1]);
    ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,80,50,.5)';ctx.lineWidth=3;ctx.stroke();ctx.restore();
  }
  if(chef.state==='LOOK')cone(chef,52*Math.PI/180,780,Math.PI/2+chef.sweep,.11);
  else if(chef.state==='TURN')cone(chef,40*Math.PI/180,260,chef.facing,.045);

  }
}

function drawCat(){
  const c=cat;shadow(c.x,c.y,25,11);
  ctx.save();ctx.translate(c.x,c.y);
  if(c.invuln>0&&Math.floor(clock*14)%2===0)ctx.globalAlpha=.45;
  ctx.rotate(c.facing+Math.PI/2);
  const sneak=keys['shift']&&state==='playing';
  const squash=sneak?.78:1;
  const walk=Math.sin(c.walk)*3*(Math.hypot(c.vx,c.vy)>30?1:0);
  // 尾巴
  ctx.strokeStyle='#2f2a33';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,16);
  ctx.quadraticCurveTo(Math.sin(c.tail)*16,34,Math.sin(c.tail)*24,44+Math.sin(c.tail*1.4)*5);ctx.stroke();
  ctx.strokeStyle='#e2a24a';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,16);
  ctx.quadraticCurveTo(Math.sin(c.tail)*16,34,Math.sin(c.tail)*24,44+Math.sin(c.tail*1.4)*5);ctx.stroke();
  // 腿
  ctx.fillStyle='#d9943c';
  ctx.fillRect(-15,10+walk,8,10);ctx.fillRect(7,10-walk,8,10);
  ctx.fillRect(-15,-12+walk,7,9);ctx.fillRect(8,-12-walk,7,9);
  // 身体
  ctx.fillStyle='#eda94b';ctx.beginPath();ctx.ellipse(0,2,20*squash,22,0,0,TAU);ctx.fill();
  ctx.strokeStyle='#2f2a33';ctx.lineWidth=3.5;ctx.stroke();
  ctx.fillStyle='#c9822f';
  ctx.beginPath();ctx.ellipse(-7,-3,3,9,.2,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(7,-3,3,9,-.2,0,TAU);ctx.fill();
  ctx.fillStyle='#f7d79a';ctx.beginPath();ctx.ellipse(0,10,9,9,0,0,TAU);ctx.fill();
  // 头
  const hy=-15;
  ctx.fillStyle='#eda94b';ctx.beginPath();ctx.arc(0,hy,16,0,TAU);ctx.fill();ctx.strokeStyle='#2f2a33';ctx.lineWidth=3.5;ctx.stroke();
  // 耳朵
  ctx.fillStyle='#eda94b';
  ctx.beginPath();ctx.moveTo(-15,hy-8);ctx.lineTo(-12,hy-25);ctx.lineTo(-3,hy-14);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(15,hy-8);ctx.lineTo(12,hy-25);ctx.lineTo(3,hy-14);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#f19aa0';
  ctx.beginPath();ctx.moveTo(-12,hy-11);ctx.lineTo(-11,hy-20);ctx.lineTo(-6,hy-13);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(12,hy-11);ctx.lineTo(11,hy-20);ctx.lineTo(6,hy-13);ctx.closePath();ctx.fill();
  // 五官
  ctx.fillStyle='#2f2a33';
  const blink=(Math.floor(clock*1.3)%7===0)?1:4;
  ctx.beginPath();ctx.ellipse(-6,hy-2,2.6,blink,0,0,TAU);ctx.fill();
  ctx.beginPath();ctx.ellipse(6,hy-2,2.6,blink,0,0,TAU);ctx.fill();
  ctx.fillStyle='#f19aa0';ctx.beginPath();ctx.moveTo(-3,hy+5);ctx.lineTo(3,hy+5);ctx.lineTo(0,hy+8);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#2f2a33';ctx.lineWidth=1.4;
  for(let s=-1;s<=1;s+=2){for(let k=0;k<2;k++){ctx.beginPath();ctx.moveTo(s*8,hy+4+k*3);ctx.lineTo(s*20,hy+1+k*5);ctx.stroke();}}
  if(c.eating){
    ctx.fillStyle='#a33a3a';ctx.beginPath();ctx.ellipse(0,hy+10,4,3+Math.abs(Math.sin(clock*18))*2,0,0,TAU);ctx.fill();
  }
  ctx.restore();
  // 状态气泡
  let mark='',col='#ffd23f';
  if(c.eating){mark='偷吃中';col='#8ff09a';}
  else if(chef.state==='CHASE'){mark='!! 快跑',col='#ff5b52';}
  else if(state==='playing'&&foodNear()){mark='E · 偷吃',col='#f5c542';}
  if(mark){
    ctx.save();ctx.globalAlpha=.95;ctx.font='900 12px "Microsoft YaHei"';
    const w=ctx.measureText(mark).width+16;
    ctx.fillStyle='rgba(23,19,31,.9)';rr(ctx,c.x-w/2,c.y-58,w,22,5);ctx.fill();
    ctx.fillStyle=col;ctx.textAlign='center';ctx.fillText(mark,c.x,c.y-42);ctx.textAlign='left';ctx.restore();
  }
}
function drawHuman(a,isChef){
  shadow(a.x,a.y,24,12);
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.facing+Math.PI/2);
  const walk=Math.sin(clock*11)*((a.state==='CHASE'||a.state==='ENTER'||a.state==='LEAVE'||a.state==='RETURN')?4:0);
  ctx.fillStyle='#2b3038';ctx.fillRect(-13,10+walk,9,11);ctx.fillRect(5,10-walk,9,11);
  const coat=isChef?'#f3f4f0':'#4a76b8';
  ctx.fillStyle=coat;ctx.beginPath();ctx.ellipse(0,2,20,21,0,0,TAU);ctx.fill();
  ctx.strokeStyle='#242832';ctx.lineWidth=3.5;ctx.stroke();
  if(isChef){ctx.fillStyle='#d7dcd6';ctx.beginPath();ctx.moveTo(-10,-8);ctx.lineTo(10,-8);ctx.lineTo(12,17);ctx.lineTo(-12,17);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.fillStyle='#e35a44';ctx.fillRect(-3,-12,6,26);}
  else{ctx.fillStyle='#f0e6d2';ctx.beginPath();ctx.moveTo(-9,-10);ctx.lineTo(9,-10);ctx.lineTo(7,14);ctx.lineTo(-7,14);ctx.closePath();ctx.fill();ctx.stroke();}
  // 手
  ctx.fillStyle=coat;ctx.beginPath();ctx.arc(-19,-2+walk,6,0,TAU);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(19,-2-walk,6,0,TAU);ctx.fill();ctx.stroke();
  if(isChef&&a.state==='CHASE'){
    ctx.strokeStyle='#8d939b';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(19,-6);ctx.lineTo(27,-26);ctx.stroke();
    ctx.fillStyle='#aab0b8';rr(ctx,21,-38,18,13,3);ctx.fill();ctx.stroke();
  }
  if(!isChef&&(a.state==='ENTER'||a.state==='PICK'||a.state==='SCAN')){
    ctx.fillStyle='#c9ced4';ctx.beginPath();ctx.ellipse(-23,-14,15,8,0,0,TAU);ctx.fill();ctx.stroke();
    ctx.fillStyle='#e07a48';ctx.beginPath();ctx.arc(-23,-19,7,0,TAU);ctx.fill();ctx.stroke();
  }
  // 头
  ctx.fillStyle='#f0c39b';ctx.beginPath();ctx.arc(0,-16,15,0,TAU);ctx.fill();ctx.strokeStyle='#242832';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#2b3038';ctx.beginPath();ctx.arc(-6,-18,2,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(6,-18,2,0,TAU);ctx.fill();
  if(isChef){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-11,-29,10,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(0,-33,12,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(11,-29,10,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';rr(ctx,-16,-30,32,12,3);ctx.fill();ctx.strokeStyle='#242832';ctx.lineWidth=3;ctx.stroke();
  }else{
    ctx.fillStyle='#2b3038';ctx.beginPath();ctx.arc(0,-26,14,Math.PI,TAU);ctx.fill();ctx.stroke();
    ctx.fillRect(-14,-28,28,5);
  }
  ctx.restore();
  // 头顶提示
  let mk='',mc='#fff';
  if(isChef){
    if(a.state==='TURN'||a.state==='COOK'&&a.susp>.7){mk='?';mc='#ffd23f';}
    if(a.state==='LOOK'){mk='?';mc='#ffd23f';}
    if(a.state==='CHASE'){mk='!';mc='#ff4034';}
    if(a.state==='COOK'&&!mk&&Math.sin(clock*2)>0){mk='';}
  }else{
    if(a.state==='PICK'){mk='传菜中';mc='#9ed2ff';}
    if(a.state==='SCAN'){mk='扫视中';mc='#ff9c4a';}
  }
  if(mk){
    ctx.save();ctx.font='900 '+(mk.length>1?'12px "Microsoft YaHei"':'26px Arial Black');
    const w=mk.length>1?ctx.measureText(mk).width+16:30;
    ctx.fillStyle='rgba(23,19,31,.9)';rr(ctx,a.x-w/2,a.y-70,w,mk.length>1?22:30,5);ctx.fill();
    ctx.fillStyle=mc;ctx.textAlign='center';ctx.fillText(mk,a.x,a.y-52);ctx.textAlign='left';ctx.restore();
  }
}
function drawEffects(){
  for(const p of particles){ctx.save();ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill();ctx.restore();}
  for(const f of floaters){ctx.save();ctx.globalAlpha=clamp(f.life,0,1);
    ctx.font='italic 900 21px Arial Black';ctx.textAlign='center';
    ctx.lineWidth=5;ctx.strokeStyle='#17131f';ctx.strokeText(f.text,f.x,f.y);
    ctx.fillStyle=f.c;ctx.fillText(f.text,f.x,f.y);ctx.textAlign='left';ctx.restore();}
  // 服务员预警箭头
  if(doorWarn>0){
    ctx.save();ctx.globalAlpha=.55+.45*Math.sin(clock*10);
    ctx.fillStyle='#ff5b52';ctx.font='900 18px Arial Black';ctx.textAlign='center';
    ctx.fillText('▼ 传菜口有人来了 ▼',1500,WH-100);ctx.textAlign='left';ctx.restore();
  }
}
function drawRadar(){
  const W=rd.width,H=rd.height,s=Math.min(W/WW,H/WH),ox=(W-WW*s)/2,oy=(H-WH*s)/2;
  rctx.setTransform(1,0,0,1,0,0);rctx.clearRect(0,0,W,H);
  rctx.fillStyle='#20242a';rctx.fillRect(0,0,W,H);
  rctx.save();rctx.translate(ox,oy);rctx.scale(s,s);
  rctx.fillStyle='#313a3c';rctx.fillRect(0,0,WW,WH);
  rctx.fillStyle='#454f50';for(const f of solids){rctx.fillRect(f.x,f.y,f.w,f.h);}
  for(const f of foods){if(f.amount<=0)continue;rctx.fillStyle=f.color;rctx.beginPath();rctx.arc(f.x,f.y,18,0,TAU);rctx.fill();}
  if(chef.state==='LOOK'||chef.state==='CHASE'){
    const ctr=chef.state==='LOOK'?Math.PI/2+chef.sweep:chef.facing;
    const hf=chef.state==='LOOK'?52*Math.PI/180:30*Math.PI/180;
    const rr2=chef.state==='LOOK'?780:560;
    rctx.fillStyle='rgba(255,80,60,.35)';rctx.beginPath();rctx.moveTo(chef.x,chef.y);
    for(const p of conePoints(chef,hf,rr2,ctr))rctx.lineTo(p[0],p[1]);
    rctx.closePath();rctx.fill();
  }
  if(waiter.active&&waiter.state==='SCAN'){
    rctx.fillStyle='rgba(90,168,255,.35)';rctx.beginPath();rctx.moveTo(waiter.x,waiter.y);
    for(const p of conePoints(waiter,58*Math.PI/180,430,waiter.facing))rctx.lineTo(p[0],p[1]);
    rctx.closePath();rctx.fill();
  }
  rctx.fillStyle='#ff4f43';rctx.beginPath();rctx.arc(chef.x,chef.y,30,0,TAU);rctx.fill();
  if(waiter.active){rctx.fillStyle='#5aa8ff';rctx.beginPath();rctx.arc(waiter.x,waiter.y,30,0,TAU);rctx.fill();}
  rctx.fillStyle='#7dff8f';rctx.beginPath();rctx.arc(cat.x,cat.y,32,0,TAU);rctx.fill();
  rctx.strokeStyle='#0c0b10';rctx.lineWidth=8;rctx.strokeRect(4,4,WW-8,WH-8);
  rctx.restore();
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,VW,VH);
  ctx.save();
  const sx=shake>0?rand(-shake,shake):0,sy=shake>0?rand(-shake,shake):0;
  ctx.translate(-cam.x+sx,-cam.y+sy);
  drawFloor();
  drawVision();
  for(const f of solids)drawFurniture(f);
  for(const f of foods)drawFood(f);
  // 角色按 y 排序
  const actors=[{y:cat.y,fn:()=>drawCat()}];
  actors.push({y:chef.y,fn:()=>drawHuman(chef,true)});
  if(waiter.active)actors.push({y:waiter.y,fn:()=>drawHuman(waiter,false)});
  actors.sort((a,b)=>a.y-b.y);actors.forEach(a=>a.fn());
  drawEffects();
  ctx.restore();
  drawRadar();
}

/* ============================ 主循环 ============================ */
let last=performance.now();
function loop(t){
  let dt=(t-last)/1000;last=t;dt=Math.min(dt,.05);
  if(state==='playing')update(dt);
  else {clock+=dt;for(const f of foods)f.glow+=dt*2;
    if(state!=='paused'){const tx=clamp(cat.x-VW/2,Math.min(0,(WW-VW)/2),Math.max(0,WW-VW));
      const ty=clamp(cat.y-VH/2,Math.min(0,(WH-VH)/2),Math.max(0,WH-VH));
      cam.x=lerp(cam.x,tx,.05);cam.y=lerp(cam.y,ty,.05);}}
  render();
  requestAnimationFrame(loop);
}
newGame();showMenu();requestAnimationFrame(loop);
})();
</script>
